<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sole Agent</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: #ffffff;
        }

        #top-gradient {
            position: fixed;
            top: -30vh;
            /* pushed well above the top edge */
            left: 0;
            width: 100vw;
            height: auto;
            display: block;
            z-index: 0;
            /* above the video container (z-index: -1) */
            pointer-events: none;
            /* clicks pass through */
        }

        .hero-content {
            position: relative;
            z-index: 2;
            /* above video and top gradient */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 6vh;
            width: 95%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .hero-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 2.8rem;
            font-weight: 400;
            color: #ffffff;
            line-height: 1.15;
            margin-bottom: 2.2rem;
            letter-spacing: -0.015em;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .hero-btn {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: #ffffff;
            background-color: #000000;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 1.3rem 2.5rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
            outline: none;
        }

        .hero-btn:hover {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
        }

        .hero-btn:active {
            transform: translateY(0);
        }

        .blinking-dot {
            width: 10px;
            height: 10px;
            background-color: #39FF14;
            border-radius: 50%;
            position: relative;
            display: inline-block;
            animation: pulse-glow 2s infinite ease-in-out;
        }

        .blinking-dot::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background-color: rgba(57, 255, 20, 0.45);
            border-radius: 50%;
            animation: wave-expand 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.85);
                box-shadow: 0 0 4px rgba(57, 255, 20, 0.3);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
                box-shadow: 0 0 12px rgba(57, 255, 20, 0.9);
            }
        }

        @keyframes wave-expand {
            0% {
                transform: scale(0.6);
                opacity: 0.9;
            }

            100% {
                transform: scale(2.3);
                opacity: 0;
            }
        }

        .footer-container {
            position: fixed;
            top: 50vh;
            left: 20px;
            right: 20px;
            width: calc(100vw - 40px);
            transform: translateY(-50%);
            /* exactly screen-centered vertically */
            z-index: 3;
            /* above every other layer */
            display: flex;
            flex-direction: column;
        }

        .footer-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            padding: 0 5px;
        }

        .footer-title {
            font-family: 'General Sans', -apple-system, sans-serif;
            font-size: 1.4rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: -0.015em;
            margin: 0;
        }

        .footer-title.quote {
            text-transform: none;
        }

        .footer-divider {
            border: none;
            height: 1px;
            background-color: rgba(255, 255, 255, 0.2);
            margin: 1.6rem 0;
            width: 100%;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }

        .footer-socials {
            display: flex;
            gap: 1.25rem;
            align-items: center;
            flex: 1;
        }

        .social-icon {
            color: rgba(255, 255, 255, 0.55);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .social-icon:hover {
            color: #ffffff;
            transform: translateY(-2px);
        }

        .footer-links {
            display: flex;
            gap: 2.8rem;
            justify-content: center;
            align-items: center;
            flex: 2;
        }

        .footer-link {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .footer-link:hover {
            opacity: 0.75;
            transform: translateY(-1px);
        }

        .footer-copyright {
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            text-align: right;
            flex: 1;
            letter-spacing: 0.02em;
        }

        .footer-logo-wrap {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            margin: 0;
        }

        .footer-logo-text {
            font-family: 'General Sans', -apple-system, sans-serif;
            font-size: 20vw;
            /* enormous, fills the width */
            font-weight: 350;
            color: #ffffff;
            letter-spacing: -0.03em;
            margin-right: -0.03em;
            transform: translateX(-20px);
            line-height: 1.0;
            margin-top: 0;
            margin-bottom: 0;
            margin-left: 0;
            text-align: center;
            width: 100%;
            pointer-events: none;
            opacity: 0.95;
            text-shadow: none;
            white-space: nowrap;
        }

        .video-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 90vh;
            /* occupies bottom 90% of viewport */
            overflow: hidden;
            z-index: -1;
            /* sits behind everything */
        }

        #bg-video {
            width: 100%;
            height: 110%;
            object-fit: cover;
            display: block;
            transform: translateY(0%);
        }

        .glass-cursor-card {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
            pointer-events: none;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 9999px;
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.15);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            will-change: transform, opacity;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                background 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-cursor-card.active {
            opacity: 1;
        }

        .glass-cursor-card.dark-mode {
            background: rgba(0, 0, 0, 0.82);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .cursor-card-text {
            font-family: 'General Sans', -apple-system, sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: #39FF14;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.45);
        }

        .cursor-card-text .text-white {
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
        }

        .cursor-ring-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 48px;
            height: 48px;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            z-index: 99998;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            will-change: transform, opacity;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.4s ease;
        }

        .cursor-ring-outline.active {
            opacity: 1;
        }

        .cursor-ring-outline.expanded {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .hero-title .word-wrapper {
            display: inline-block;
            overflow: hidden;
            vertical-align: bottom;
            padding-bottom: 0.15em;
            /* room so descenders (y, p, g) aren't clipped */
            margin-bottom: -0.15em;
        }

        .hero-title .word-inner {
            display: inline-block;
            opacity: 0;
            transform: translateY(105%);
            filter: blur(20px);
            animation: word-reveal-mask 1.3s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
        }

        @keyframes word-reveal-mask {
            0% {
                opacity: 0;
                transform: translateY(105%);
                filter: blur(20px);
            }

            30% {
                opacity: 1;
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        .footer-logo-text .letter-wrapper {
            display: inline-block;
            overflow: hidden;
            vertical-align: bottom;
            line-height: 0.6;
        }

        .footer-logo-text .letter-inner {
            display: inline-block;
            opacity: 0;
            transform: translateX(-105%);
            filter: blur(20px);
            animation: letter-reveal-mask 1.2s cubic-bezier(0.05, 0.9, 0.1, 1) forwards;
        }

        @keyframes letter-reveal-mask {
            0% {
                opacity: 0;
                transform: translateX(-105%);
                filter: blur(20px);
            }

            25% {
                opacity: 1;
            }

            100% {
                opacity: 0.95;
                transform: translateX(0);
                filter: blur(0);
            }
        }
    </style>
</head>

<body>

    <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/black_gradient.svg"
        alt="Top Gradient" id="top-gradient">

    <main class="hero-content">
        <h1 class="hero-title">Apply Now to be part <br> of the closed beta</h1>
        <a href="/interview" class="hero-btn" style="text-decoration: none;">
            <span class="btn-text">Start the Interview</span>
            <span class="blinking-dot"></span>
        </a>
    </main>

    <footer class="footer-container">
        <div class="footer-top">
            <h2 class="footer-title">Stay in Touch</h2>
            <h2 class="footer-title quote">Think. Build. Repeat.</h2>
        </div>

        <hr class="footer-divider">

        <div class="footer-bottom">
            <div class="footer-socials"></div>

            <div class="footer-copyright">
                © 2026 Sole Agent
            </div>
        </div>
    </footer>

    <div class="footer-logo-wrap">
        <h2 class="footer-logo-text">Sole Agent</h2>
    </div>

    <div class="video-container">
        <video autoplay muted playsinline loop id="bg-video">
            <source
                src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/flower.mp4"
                type="video/mp4">
            Ваш браузер не поддерживает видео.
        </video>
    </div>

    <div id="cursor-ring" class="cursor-ring-outline"></div>

    <div id="glass-card" class="glass-cursor-card">
        <span class="cursor-card-text"><span class="text-white">Say</span> Hello!</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoText = document.querySelector('.footer-logo-text');

            if (logoText) {
                const text = logoText.textContent.trim();
                logoText.innerHTML = ''; // Очищаем контейнер

                // Разделяем слово на отдельные буквы и оборачиваем каждую в двойной span для маски
                [...text].forEach((char, index) => {
                    // Внешний span выступает в роли маски (overflow: hidden)
                    const wrapper = document.createElement('span');
                    wrapper.className = 'letter-wrapper';

                    // Внутренний span содержит букву и анимируется слева направо
                    const inner = document.createElement('span');
                    inner.textContent = char === ' ' ? ' ' : char; // Обрабатываем пробелы
                    inner.className = 'letter-inner';

                    // Задаем задержку анимации для каждой буквы:
                    // 9 букв, задержка шага 0.09с, длительность анимации 1.2с.
                    // Последняя буква закончит выдвигаться ровно на отметке: 0.72с (задержка) + 1.2с (анимация) = 1.92 секунды!
                    inner.style.animationDelay = `${index * 0.09}s`;

                    wrapper.appendChild(inner);
                    logoText.appendChild(wrapper);
                });
            }

            // Разделение верхнего заголовка на слова для анимации появления снизу вверх из маски с блюром
            const heroTitle = document.querySelector('.hero-title');
            if (heroTitle) {
                const text = heroTitle.innerHTML;
                // Разделяем по пробелам, сохраняя теги <br>
                const parts = text.split(/(\s+|<br\s*\/?>)/i);
                heroTitle.innerHTML = '';

                let wordIndex = 0;
                parts.forEach(part => {
                    if (part.trim() === '') {
                        // Обычный пробел между словами
                        heroTitle.appendChild(document.createTextNode(' '));
                    } else if (part.toLowerCase().startsWith('<br')) {
                        // Сохраняем перенос строки
                        heroTitle.appendChild(document.createElement('br'));
                    } else {
                        // Обертка-маска (overflow: hidden)
                        const wrapper = document.createElement('span');
                        wrapper.className = 'word-wrapper';

                        // Внутреннее слово, сдвинутое вниз и заблюренное
                        const inner = document.createElement('span');
                        inner.className = 'word-inner';
                        inner.textContent = part;

                        // Задержка анимации: шаг 0.1с для размеренного, солидного появления
                        inner.style.animationDelay = `${wordIndex * 0.1}s`;
                        wordIndex++;

                        wrapper.appendChild(inner);
                        heroTitle.appendChild(wrapper);
                    }
                });
            }

            // Летающий оутлайновый белый кружок и стеклянная плашка за курсором (LERP-физика)
            const glassCard = document.getElementById('glass-card');
            const cursorRing = document.getElementById('cursor-ring');

            if (glassCard && cursorRing) {
                let mouseX = window.innerWidth / 2;
                let mouseY = window.innerHeight / 2;

                // Координаты для плашки (медленное движение)
                let cardX = mouseX;
                let cardY = mouseY;

                // Координаты для кружка (более быстрое движение)
                let ringX = mouseX;
                let ringY = mouseY;

                let isFirstMove = true;
                let scale = 0;
                let targetScale = 0;
                let isHoveringBtn = false; // Флаг наведения на кнопку Book a Demo

                // Отслеживаем координаты курсора
                document.addEventListener('mousemove', (e) => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;

                    if (isFirstMove) {
                        // Мгновенно позиционируем при первом движении, чтобы избежать "прыжка"
                        cardX = mouseX;
                        cardY = mouseY;
                        ringX = mouseX;
                        ringY = mouseY;
                        isFirstMove = false;
                        glassCard.classList.add('active');
                        cursorRing.classList.add('active');
                    }

                    // Показываем элементы только если курсор не находится на кнопке Book a demo
                    if (!isHoveringBtn) {
                        targetScale = 1;
                    }
                });

                // Плавное скрытие при выходе курсора за пределы экрана
                document.addEventListener('mouseleave', () => {
                    targetScale = 0;
                });

                // Плавное появление при возвращении курсора в окно
                document.addEventListener('mouseenter', () => {
                    if (!isHoveringBtn) {
                        targetScale = 1;
                    }
                });

                // Слушатели наведения на кнопку "Book a demo" для переключения режимов
                const heroBtn = document.querySelector('.hero-btn');
                if (heroBtn) {
                    heroBtn.addEventListener('mouseenter', () => {
                        isHoveringBtn = true;
                        targetScale = 0; // Плавное скрытие плашки (scale 0)
                        cursorRing.classList.add('expanded'); // Добавляем класс расширения кружка в CSS
                    });
                    heroBtn.addEventListener('mouseleave', () => {
                        isHoveringBtn = false;
                        targetScale = 1; // Плавное возвращение плашки
                        cursorRing.classList.remove('expanded'); // Сброс расширения кружка
                    });
                }

                // Системный цикл анимации (60-120 кадров/сек) для сглаживания
                const updatePhysics = () => {
                    // Мягкое отставание плашки: коэффициент LERP 0.08
                    cardX += (mouseX - cardX) * 0.08;
                    cardY += (mouseY - cardY) * 0.08;

                    // Кружок следует за курсором мгновенно и без задержки
                    ringX = mouseX;
                    ringY = mouseY;

                    // Интерполируем масштаб для плавного появления/исчезновения
                    scale += (targetScale - scale) * 0.15;

                    // Масштаб кружка (если навели на кнопку, он увеличивается до 1.6 через класс expanded)
                    // Но мы всё еще перемножаем его на общий scale, чтобы кружок сжался в 0 при выходе с экрана
                    const currentRingScale = cursorRing.classList.contains('expanded') ? 1.6 * scale : scale;

                    // Применяем аппаратную 3D-трансформацию
                    glassCard.style.transform = `translate3d(${cardX}px, ${cardY}px, 0) translate(-50%, -50%) scale(${scale})`;
                    cursorRing.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%) scale(${currentRingScale})`;

                    requestAnimationFrame(updatePhysics);
                };

                updatePhysics();
            }
        });
    </script>
</body>

</html>
